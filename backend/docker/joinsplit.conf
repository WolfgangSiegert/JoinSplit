<Directory /var/www/html/public>
    AllowOverride All
    Options FollowSymLinks
    Require all granted
</Directory>

ProxyRequests Off
ProxyPreserveHost On
ProxyPass /index.php !
ProxyPass /api !
ProxyPass /up !
ProxyPass /ready !
ProxyPass / http://127.0.0.1:3000/
ProxyPassReverse / http://127.0.0.1:3000/
