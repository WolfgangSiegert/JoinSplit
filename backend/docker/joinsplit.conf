<Directory /var/www/html/public>
    AllowOverride All
    Options FollowSymLinks
    Require all granted
</Directory>

# Keep operational access logs useful without persisting request paths,
# query strings, referrers, user agents, or browser-bound entity identifiers.
LogFormat "method=%m status=%>s bytes=%B duration_us=%D" joinsplit_privacy
ServerName localhost

ProxyRequests Off
ProxyPreserveHost On
ProxyPass /index.php !
ProxyPass /api !
ProxyPass /up !
ProxyPass /ready !
ProxyPass / http://127.0.0.1:3000/
ProxyPassReverse / http://127.0.0.1:3000/
